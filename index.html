<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korean Student Visa Consultancy PMS &amp; Task Manager</title>
    <meta name="description" content="Centralized Project Management System for South Korean university admissions, D-2/D-4 student visa processing, document verification, apostilles, DHL dispatch tracking, and team task orchestration with two-way Google Sheets synchronization." />
    <meta property="og:title" content="Korean Student Visa Consultancy PMS &amp; Task Manager" />
    <meta property="og:description" content="Centralized Project Management System for South Korean university admissions, D-2/D-4 student visa processing, document verification, apostilles, DHL dispatch tracking, and team task orchestration with two-way Google Sheets synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Silence Vite HMR websocket disconnection rejections in sandbox environment
      window.addEventListener('unhandledrejection', function(event) {
        const msg = event?.reason?.message || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
      // Synchronous theme resolution to avoid flash of light mode
      (function() {
        try {
          var stored = localStorage.getItem('pms_theme_preference');
          if (!stored) {
            var rawState = localStorage.getItem('KOREA_STUDY_HUB_PMS_STATE_V1');
            if (rawState) {
              var parsed = JSON.parse(rawState);
              if (parsed?.settings?.theme) stored = parsed.settings.theme;
            }
          }
          var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#F4F2EE] text-[#172B4D] dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-[#1769E8] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
