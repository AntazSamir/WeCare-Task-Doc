<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korean Student Visa Consultancy PMS &amp; Task Manager</title>
    <meta name="description" content="Centralized Project Management System for South Korean university admissions, D-2/D-4 student visa processing, document verification, apostilles, DHL dispatch tracking, and team task orchestration with two-way Google Sheets synchronization." />
    <meta property="og:title" content="Korean Student Visa Consultancy PMS &amp; Task Manager" />
    <meta property="og:description" content="Centralized Project Management System for South Korean university admissions, D-2/D-4 student visa processing, document verification, apostilles, DHL dispatch tracking, and team task orchestration with two-way Google Sheets synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Prevent FOUC: apply saved Light / Dark / System preference before first paint
      (function() {
        try {
          var pref = localStorage.getItem('pms_theme_preference');
          if (!pref) {
            var raw = localStorage.getItem('sheetsync_pc_state_v1');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.settings && parsed.settings.theme) {
                pref = parsed.settings.theme;
              }
            }
          }
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
      // Silence Vite HMR websocket disconnection rejections in sandbox environment
      window.addEventListener('unhandledrejection', function(event) {
        const msg = event?.reason?.message || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[var(--color-main-bg)] text-[var(--color-primary-text)] antialiased selection:bg-[var(--color-primary-blue)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
