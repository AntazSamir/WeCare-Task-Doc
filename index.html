<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeCare Task</title>
    <link rel="icon" type="image/webp" href="/assets/wecare_task_logo.webp" />
    <meta name="description" content="WeCare Task — Centralized Project Management System for South Korean university admissions, D-2/D-4 student visa processing, document verification, apostilles, DHL dispatch tracking, and team task orchestration with two-way Google Sheets synchronization." />
    <meta property="og:title" content="WeCare Task" />
    <meta property="og:description" content="Centralized Project Management System for South Korean university admissions, D-2/D-4 student visa processing, document verification, apostilles, DHL dispatch tracking, and team task orchestration with two-way Google Sheets synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mona+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      // Silence Vite HMR websocket disconnection rejections in sandbox environment
      window.addEventListener('unhandledrejection', function(event) {
        const msg = event?.reason?.message || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
      // Synchronous theme resolution to avoid flash of light mode
      (function() {
        try {
          var stored = localStorage.getItem('pms_theme_preference');
          if (!stored) {
            var rawState = localStorage.getItem('KOREA_STUDY_HUB_PMS_STATE_V1');
            if (rawState) {
              var parsed = JSON.parse(rawState);
              if (parsed?.settings?.theme) stored = parsed.settings.theme;
            }
          }
          var isDark = stored === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-[#1E40AF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
